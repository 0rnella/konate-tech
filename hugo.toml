baseURL = 'https://konate.tech/'
locale = 'en-us'
title = 'Konaté Tech B.V.'

[params]
  brand = 'Konaté Tech'
  legalName = 'Konaté Tech B.V.'
  email = 'ornella@konate.tech'
  city = 'Amsterdam, NL'
  kvk = '92366228'
  vat = 'NL866021735B01'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Case Studies'
    pageRef = '/case-studies'
    weight = 20

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'

[markup]
  # Needed so layout shortcodes like {{< band >}}/{{< quotes >}} can wrap
  # markdown (which itself may call other shortcodes) and re-render it
  # via .RenderString without Hugo stripping the resulting HTML. Content
  # here is always our own — never third-party input.
  [markup.goldmark.renderer]
    unsafe = true
  # Lets a paragraph opt into the `.lede` pull-statement style with a
  # trailing `{.lede}` in the markdown, instead of a one-off shortcode.
  [markup.goldmark.parser.attribute]
    block = true
