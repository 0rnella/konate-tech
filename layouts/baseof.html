<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body{{ if .IsHome }} class="has-hero"{{ end }}>
  <header>
    {{ partial "header.html" . }}
  </header>
  {{ if .IsHome }}
    {{ partial "hero.html" . }}
  {{ end }}
  <main class="content{{ if .IsHome }} content-wide{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
